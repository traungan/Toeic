
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Englishie ♡</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap');

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  font-family: 'Nunito', sans-serif;
  color: #715469;
  background: linear-gradient(135deg, #ffe7f0, #f0e7ff, #e6fff5);
  overflow-x: hidden;
}

body::before {
  content: "♡ ୨୧ ♡";
  position: fixed;
  top: 20px;
  left: 15px;
  color: #efa5c6;
  font-size: 28px;
  opacity: .65;
}

body::after {
  content: "✿ ♡ ✿";
  position: fixed;
  bottom: 20px;
  right: 15px;
  color: #b39bdf;
  font-size: 28px;
  opacity: .65;
}

.card {
  width: 100%;
  max-width: 560px;
  padding: 32px 24px;
  border-radius: 30px;
  background: rgba(255,255,255,.88);
  border: 2px solid white;
  box-shadow: 0 15px 45px #c9a6cc45;
  position: relative;
}

.page { text-align: center; }
.hidden { display: none !important; }

.tag {
  font-size: 11px;
  letter-spacing: 3px;
  font-weight: 900;
  color: #c57fa7;
}

.bunny {
  font-size: 65px;
  margin: 20px 0 10px;
  animation: float 2s infinite ease-in-out;
}

@keyframes float {
  50% { transform: translateY(-7px) rotate(3deg); }
}

h1 {
  font-size: clamp(43px, 10vw, 64px);
  line-height: 1;
  margin: 15px 0;
  color: #ee8fb5;
  letter-spacing: -2px;
}

h1 span { color: #ac94e5; }

.subtitle {
  line-height: 1.8;
  font-size: 15px;
  margin: 18px 0;
}

.pill {
  display: inline-block;
  background: #f2eaff;
  color: #987ac7;
  padding: 8px 15px;
  border-radius: 30px;
  font-size: 12px;
  font-weight: 900;
}

button {
  font-family: inherit;
  cursor: pointer;
  transition: .2s;
}

button:hover { transform: translateY(-2px); }

.main-btn {
  border: none;
  background: linear-gradient(135deg, #ff9fbe, #e9a0ec);
  color: white;
  padding: 15px 28px;
  border-radius: 18px;
  font-size: 17px;
  font-weight: 900;
  box-shadow: 0 6px 0 #d98ab9;
  margin-top: 25px;
}

.main-btn:active {
  transform: translateY(3px);
  box-shadow: 0 3px 0 #d98ab9;
}

.note {
  font-size: 11px;
  color: #b29aad;
  margin-top: 25px;
}

.top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 12px;
  font-weight: 900;
  color: #a486ce;
  margin-bottom: 12px;
}

.progress {
  height: 10px;
  background: #f5e8f3;
  border-radius: 20px;
  overflow: hidden;
  margin-bottom: 25px;
}

.bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #ff9fbe, #b9a1f2);
  transition: width .3s;
}

.question {
  text-align: left;
  font-size: 24px;
  line-height: 1.5;
  margin: 12px 0 22px;
  overflow-wrap: anywhere;
}

.answers {
  display: grid;
  gap: 12px;
}

.answer {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 13px;
  text-align: left;
  border: 2px solid #f5e0eb;
  border-radius: 17px;
  background: #fff8fb;
  color: #715469;
  font-size: 15px;
  font-weight: 800;
}

.letter {
  min-width: 35px;
  height: 35px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: #ffe2ed;
  color: #d5789e;
}

.answer:hover:not(:disabled) {
  border-color: #f19abd;
  background: #fff0f6;
}

.answer.correct {
  background: #e6fff0;
  border-color: #77d5a0;
}

.answer.wrong {
  background: #fff0f1;
  border-color: #ff9aaa;
}

.answer:disabled { cursor: default; }

.feedback {
  margin: 18px 0 5px;
  min-height: 25px;
  font-size: 14px;
  font-weight: 900;
}

.next {
  width: 100%;
  margin-top: 12px;
}

.score {
  font-size: 70px;
  font-weight: 900;
  color: #ed8eb5;
  margin: 20px 0;
}

.result-title {
  font-size: 31px;
  margin: 12px 0;
  color: #b08bda;
}

.review {
  text-align: left;
  background: #fff6fa;
  padding: 15px;
  border-radius: 17px;
  margin-top: 20px;
  font-size: 13px;
  line-height: 1.8;
  overflow-wrap: anywhere;
}

@media(max-width: 380px) {
  .card { padding: 25px 16px; }
  .question { font-size: 21px; }
}
</style>
</head>

<body>
<main class="card">

  <!-- WELCOME MENU -->
  <section id="home" class="page">
    <div class="tag">✿ YOUR LITTLE STUDY CORNER ✿</div>
    <div class="bunny">🐰🎀</div>
    <h1>Englishie <span>♡</span></h1>
    <p class="subtitle">
      Learn a little, grow a little 🌷<br>
      Let's make English fun together!
    </p>
    <p class="pill">♡ 10 QUESTIONS · 100 POINTS ♡</p>
    <br>
    <button class="main-btn" onclick="startGame()">
      Get Started ♡
    </button>
    <p class="note">made with love, matcha & little dreams ☁️</p>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div class="top">
      <span id="counter">QUESTION 01 / 10</span>
      <span id="liveScore">♡ 0 POINTS</span>
    </div>

    <div class="progress">
      <div class="bar" id="bar"></div>
    </div>

    <div class="tag">CHOOSE YOUR ANSWER ✧</div>
    <h2 class="question" id="question"></h2>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback"></div>

    <button id="next" class="main-btn next hidden"
      onclick="nextQuestion()">
      Next question →
    </button>
  </section>

  <!-- RESULTS -->
  <section id="result" class="page hidden">
    <div class="bunny" id="resultBunny">🐣</div>
    <div class="tag">YOUR LITTLE REPORT CARD</div>
    <h2 class="result-title" id="resultTitle"></h2>
    <div class="score" id="finalScore">0/100</div>
    <p class="subtitle" id="resultMessage"></p>
    <div class="review" id="review"></div>

    <button class="main-btn" onclick="goHome()">
      Play Again ♡
    </button>
    <p class="note">every little step counts 🌱</p>
  </section>

</main>

<script>
const questions = [
  {
    q: "I'm ... on this game.",
    options: ["focus", "focusing", "losing focus"],
    correct: 1
  },
  {
    q: "I hate ... homework.",
    options: ["do", "does", "doing"],
    correct: 2
  },
  {
    q: "I think IELTS is ... from TOEIC.",
    options: ["different", "another", "distinctive"],
    correct: 0
  },
  {
    q: "I was ... homework when I called her.",
    options: ["do", "doing", "does"],
    correct: 1
  },
  {
    q: "I have a dream of ... a foodie who also has money.",
    options: ["be", "to be", "becoming"],
    correct: 2
  },
  {
    q: "Do you prefer playing ukulele ... playing guitar?",
    options: ["than", "to", "most"],
    correct: 1
  },
  {
    q: "I wish I ... never met you; just stop at that beautiful name.",
    options: ["want", "have", "had"],
    correct: 2
  },
  {
    q: "It ... bearable in the past.",
    options: ["was very", "very", "is"],
    correct: 0
  },
  {
    q: "I'm ... to buy a Sony A6000.",
    options: ["forward", "love", "looking"],
    correct: 2
  },
  {
    q: "I have no ... for ungrateful people.",
    options: ["expectations", "hope", "trust"],
    correct: 0
  }
];

let current = 0;
let score = 0;
let locked = false;
let history = [];

function showPage(id) {
  ["home", "quiz", "result"].forEach(page => {
    document.getElementById(page).classList.toggle(
      "hidden", page !== id
    );
  });
}

function startGame() {
  current = 0;
  score = 0;
  history = [];
  showPage("quiz");
  renderQuestion();
}

function renderQuestion() {
  locked = false;

  const item = questions[current];

  document.getElementById("counter").textContent =
    `QUESTION ${String(current + 1).padStart(2, "0")} / 10`;

  document.getElementById("liveScore").textContent =
    `♡ ${score} POINTS`;

  document.getElementById("bar").style.width =
    `${current / questions.length * 100}%`;

  document.getElementById("question").textContent = item.q;
  document.getElementById("feedback").textContent = "";
  document.getElementById("next").classList.add("hidden");

  const container = document.getElementById("answers");
  container.innerHTML = "";

  item.options.forEach((option, i) => {
    const button = document.createElement("button");
    button.className = "answer";

    const letter = document.createElement("span");
    letter.className = "letter";
    letter.textContent = String.fromCharCode(65 + i);

    const text = document.createElement("span");
    text.textContent = option;

    button.append(letter, text);
    button.onclick = () => chooseAnswer(i, button);
    container.appendChild(button);
  });
}

function chooseAnswer(choice, button) {
  if (locked) return;
  locked = true;

  const item = questions[current];
  const buttons = document.querySelectorAll(".answer");
  const correctAnswer = item.correct;

  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === correctAnswer) b.classList.add("correct");
  });

  const isCorrect = choice === correctAnswer;

  if (isCorrect) {
    score += 10;
    document.getElementById("feedback").textContent =
      "Yayyy! Correct answer! ✨ +10 points";
    document.getElementById("feedback").style.color = "#36a879";
  } else {
    button.classList.add("wrong");
    document.getElementById("feedback").textContent =
      "Almost! Keep learning, cutie ♡";
    document.getElementById("feedback").style.color = "#d57891";
  }

  history.push({
    question: item.q,
    correct: item.options[correctAnswer],
    chosen: item.options[choice],
    isCorrect
  });

  document.getElementById("liveScore").textContent =
    `♡ ${score} POINTS`;

  document.getElementById("bar").style.width =
    `${(current + 1) / questions.length * 100}%`;

  const next = document.getElementById("next");
  next.textContent = current === questions.length - 1
    ? "See my results ✧"
    : "Next question →";
  next.classList.remove("hidden");
}

function nextQuestion() {
  if (!locked) return;

  if (current < questions.length - 1) {
    current++;
    renderQuestion();
  } else {
    showResults();
  }
}

function escapeHTML(text) {
  return text.replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function showResults() {
  showPage("result");

  document.getElementById("finalScore").textContent =
    `${score}/100`;

  let title, message, bunny;

  if (score < 30) {
    title = "It's okay ♡";
    message = "You tried, and that matters! Keep practicing and you'll learn more every day. 🌱";
    bunny = "🐣";
  } else if (score < 70) {
    title = "Fine, keep going!";
    message = "Nice try! Review your answers and come back stronger next time. You've got this! 💗";
    bunny = "🐰";
  } else if (score < 80) {
    title = "Good job, cutie!";
    message = "You're getting there! A little more practice and you'll shine even brighter. ✨";
    bunny = "🧸";
  } else {
    title = "Amazing match!";
    message = "You did amazing! Keep learning and let your English bloom. So proud of you! 🌸";
    bunny = "🏆";
  }

  document.getElementById("resultTitle").textContent = title;
  document.getElementById("resultMessage").textContent = message;
  document.getElementById("resultBunny").textContent = bunny;

  const mistakes = history.filter(item => !item.isCorrect);
  const review = document.getElementById("review");

  if (mistakes.length === 0) {
    review.innerHTML =
      "<strong>🌟 Perfect score, genius!</strong><br>You got every question right! ♡";
  } else {
    review.innerHTML = "<strong>🌷 Let's review together</strong><br><br>" +
      mistakes.map(item =>
        `♡ ${escapeHTML(item.question)}<br>` +
        `<span style="color:#bd7c9d">Your answer: ${escapeHTML(item.chosen)}</span><br>` +
        `<span style="color:#36a879">Correct: ${escapeHTML(item.correct)}</span>`
      ).join("<br><br>");
  }
}

function goHome() {
  showPage("home");
}
</script>
</body>
</html>
